name: "Release"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      recache:
        description: 'Delete Cache before Build?'
        required: false
        options: [ 'yes', 'no' ]
        type: choice
        default: 'no'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  clear_cache:
    runs-on: ubuntu-slim
    if: ${{ github.event.inputs.recache == 'yes' }}
    permissions:
      actions: write
      contents: read

    steps:
      - name: clear_cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ONWER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -e +o pipefail
          echo "::notice::Recache selected - Deleting all caches for this workflow ..."
          gh cache delete --all --succeed-on-no-caches \
            --repo $GH_ONWER/$GH_REPO

  generate:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
          - arch: arm64
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.clear_cache.result != 'failure' }}
    needs: [ clear_cache ]
    permissions:
      contents: write
    env:
      # Each LM Studio architecture has its own version stream.
      COMPARE_FILE0: /tmp/.compare-content-${{ matrix.arch }}.txt
      COMPARE_FILE1: /tmp/.compare-content-${{ matrix.arch }}-new.txt
    steps:
      - name: prepare workflow
        id: prepare_workflow
        run: | 
          case "${{ runner.arch }}" in
            X64)   echo "RUNNER_ARCH=x64" >> "$GITHUB_OUTPUT"               ;;
            ARM64) echo "RUNNER_ARCH=arm64" >> "$GITHUB_OUTPUT"             ;;
            X86)   echo "RUNNER_ARCH=x86" >> "$GITHUB_OUTPUT"               ;;
            ARM)   echo "RUNNER_ARCH=arm" >> "$GITHUB_OUTPUT"               ;;
            *)     echo "Failed to determine runner architecture" && exit 1 ;;
          esac

      - name: Find latest tag (7z version)
        id: update_build_find_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ip7z/7zip
          #FIXED_TAG: 26.04
        run: |
          [ -n "$FIXED_TAG" ] && echo "tag=$FIXED_TAG" >> $GITHUB_OUTPUT && exit 0

          if ! LATEST_TAG=$(gh api repos/$REPOSITORY/releases --jq '[.[] | select(.prerelease == false)][0].tag_name' 2>/dev/null); then
            echo "::error::Failed to fetch latest tag for repository $REPOSITORY"
          elif [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::warning::No tags found for repository $REPOSITORY"
          else
            echo "::notice::Latest tag for repository $REPOSITORY: $LATEST_TAG"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: locale
        run: sudo $SHELL -c "locale-gen en_US.utf8 && update-locale"

      - name: clone
        uses: actions/checkout@v7

      - name: cache_7zbin
        uses: actions/cache@v6
        with:
          path: |
            /tmp/7z-linux-${{ steps.prepare_workflow.outputs.RUNNER_ARCH }}.tar.xz
          key: ${{ github.job }}-${{ matrix.arch }}-7z-${{ steps.update_build_find_latest.outputs.tag }}

      - name: dependencies
        env:
          SEVENZ_VERSION: ${{ steps.update_build_find_latest.outputs.tag }}
          SEVENZ_ARCH: ${{ steps.prepare_workflow.outputs.RUNNER_ARCH }}
        run: |
          SEVENZ_VERSION_NO_DOT=$(printf '%s' "$SEVENZ_VERSION" | tr -d '.')
          [ ! -f /tmp/7z-linux-${SEVENZ_ARCH}.tar.xz ] && wget -q --show-progress --progress=dot:mega --timeout=20 --tries=5 --waitretry=5 -O /tmp/7z-linux-${SEVENZ_ARCH}.tar.xz "https://github.com/ip7z/7zip/releases/download/${SEVENZ_VERSION}/7z${SEVENZ_VERSION_NO_DOT}-linux-${SEVENZ_ARCH}.tar.xz"
          sudo tar -xf /tmp/7z-linux-${SEVENZ_ARCH}.tar.xz -C /usr/local/bin/ 7zzs
          sudo ln -sf /usr/local/bin/7zzs /usr/local/bin/7z
          sudo chmod +x /usr/local/bin/7zzs /usr/local/bin/7z
        
      - name: download
        run: |
          rm -rf App/LMStudio && mkdir -p App/LMStudio
          wget -q --show-progress --progress=dot:mega --timeout=20 --tries=5 --waitretry=5 -O LMStudioInstaller.exe https://lmstudio.ai/download/latest/win32/${{ matrix.arch }}
      
      - name: check
        id: check
        run: |
          7z l LMStudioInstaller.exe >/tmp/7z_check.log
          SEVENZ_CHECK_VERSION="$(grep "ProductVersion" /tmp/7z_check.log | grep "+" | head -n1 | awk -F' ' '{ print $2 }' 2>/dev/null || true)"
          [ -n "$SEVENZ_CHECK_VERSION" ] && SEVENZ_CHECK_VERSION="$(echo "$SEVENZ_CHECK_VERSION" | tr '+' '-' 2>/dev/null || true)"
          [ -z "$SEVENZ_CHECK_VERSION" ] && SEVENZ_CHECK_VERSION="$(grep "ProductVersion" /tmp/7z_check.log | head -n1 | awk -F' ' '{ print $2 }' 2>/dev/null || true)"
          [ -z "$SEVENZ_CHECK_VERSION" ] && echo "7z_check_version: not found" && exit 1
          [ -n "$SEVENZ_CHECK_VERSION" ] && echo "7z_check_version: $SEVENZ_CHECK_VERSION"
          echo "SEVENZ_CHECK_VERSION=$SEVENZ_CHECK_VERSION" >> $GITHUB_OUTPUT

      - name: cache_load
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.COMPARE_FILE0 }}
          key: ${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.job }}-${{ matrix.arch }}-

      - name: compare
        shell: bash
        id: compare
        run: |
          echo "${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}" > ${{ env.COMPARE_FILE1 }}

          if [ ! -e "${{ env.COMPARE_FILE0 }}" ]; then
            echo "copy File for cache"
            cp ${{ env.COMPARE_FILE1 }} ${{ env.COMPARE_FILE0 }}
          else
            CONTENT_FILE0=$(cat ${{ env.COMPARE_FILE0 }})
            CONTENT_FILE1=$(cat ${{ env.COMPARE_FILE1 }})
            if [ "$CONTENT_FILE0" = "$CONTENT_FILE1" ]; then
              echo "Still at latest version"
              echo "latest_version=true" >> $GITHUB_OUTPUT
            else
              echo "Not at latest version"
              cp ${{ env.COMPARE_FILE1 }} ${{ env.COMPARE_FILE0 }}
            fi
          fi

      - name: generate
        if: steps.compare.outputs.latest_version != 'true'
        env:
          LANG: en_US.utf8
        run: |
          #prepare
          ARCH_WITHOUT_X=$(printf '%s' "${{ matrix.arch }}" | tr -d 'x')
          
          #extract
          7z x LMStudioInstaller.exe "\$PLUGINSDIR/app-${ARCH_WITHOUT_X}.7z" -o./ && rm -f LMStudioInstaller.exe
          7z x "\$PLUGINSDIR/app-${ARCH_WITHOUT_X}.7z" -o./App/LMStudio && rm -rf "\$PLUGINSDIR/app-${ARCH_WITHOUT_X}.7z"

          #repack
          7z a -t7z -mx=3 -mmt=on -m0=lzma2 /tmp/LMStudioPortable-${{ matrix.arch }}-${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}.7z \
            ./App \
            ./Other \
            ./help.html \
            ./LICENSE.txt \
            LMStudioPortable.exe

      - name: cache_save
        if: always() && steps.compare.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.COMPARE_FILE0 }}
          key: ${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}

      - name: Delete existing tag
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER_REPO: ${{ github.repository }}
        continue-on-error: true
        if: steps.compare.outputs.latest_version != 'true'
        run: gh release delete "${{ matrix.arch }}-${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}" --cleanup-tag --yes --repo $GH_OWNER_REPO

      - name: Publish release
        if: steps.compare.outputs.latest_version != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER_REPO: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}
          TAG_NAME: ${{ matrix.arch }}-${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}
          ARCHIVE: /tmp/LMStudioPortable-${{ matrix.arch }}-${{ steps.check.outputs.SEVENZ_CHECK_VERSION }}.7z
        run: |
          cat > /tmp/release-notes.txt <<EOF
          ### LMStudio Portable
          - Architecture: ${ARCH}
          - Version: ${VERSION}
          EOF

          if [ "$ARCH" = arm64 ]; then
            gh release create "$TAG_NAME" \
              --title "LMStudio Portable ${ARCH} ${VERSION}" \
              --notes-file /tmp/release-notes.txt \
              --prerelease=true \
              --draft=false \
              --latest=false \
              --repo "$GH_OWNER_REPO" "$ARCHIVE"
          else
            gh release create "$TAG_NAME" \
              --title "LMStudio Portable ${ARCH} ${VERSION}" \
              --notes-file /tmp/release-notes.txt \
              --prerelease=false \
              --draft=false \
              --latest=true \
              --repo "$GH_OWNER_REPO" "$ARCHIVE"
          fi
